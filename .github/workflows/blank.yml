name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'لینک مستقیم فایل zip پروژه'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project zip
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o project.zip

      - name: Extract zip
        run: |
          unzip project.zip
          PROJECT_DIR=$(unzip -Z1 project.zip | head -1 | cut -d/ -f1)
          mv "$PROJECT_DIR"/* . 2>/dev/null || true
          mv "$PROJECT_DIR"/.[!.]* . 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Vazirmatn font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -L "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/Vazirmatn-Regular.ttf" \
            -o app/src/main/assets/fonts/Vazirmatn-Regular.ttf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
